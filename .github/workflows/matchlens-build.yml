name: MatchLens build checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Upload dependency lockfile for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchlens-package-lock
          path: package-lock.json
          if-no-files-found: warn
