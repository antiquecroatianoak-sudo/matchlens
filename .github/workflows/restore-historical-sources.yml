name: Restore historical source archive
on:
  push:
    branches:
      - feature/factor-tracker-context-v1
    paths:
      - .github/workflows/restore-historical-sources.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all manifest sources with checksum verification
        run: python -m ingestion.restore_manifest_sources
      - name: Save imported source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/upstream_openfootball/
          if ! git diff --cached --quiet; then
            git commit -m "Restore all checksum-verified historical source files"
            git push
          fi
