name: Testovi

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r analytics/requirements.txt
      - name: Provjera snapshotova prema manifestu (izvještajno, 6 poznatih razlika)
        run: python analytics/verify_snapshots.py
      - run: python -m unittest discover -s tests -p 'test*py' -v
