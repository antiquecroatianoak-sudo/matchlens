name: Run exploratory historical test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m analytics.build_result_features
      - run: python -m ingestion.import_statsbomb_catalog
      - run: python -m analytics.create_factor_database /tmp/matchlens_factors.sqlite
      - run: python -m analytics.connect_external_factors
      - run: python -m analytics.audit_normalized_readiness
      - run: python -m analytics.test_normalized_archive
