name: MatchLens failure diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/matchlens-failure-diagnosis.yml']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Inspect latest five-year test and publish failed step
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GH_REPO']
          def gh(path):
              p=subprocess.run(['gh','api',path],capture_output=True,text=True)
              if p.returncode: raise RuntimeError(p.stderr)
              return json.loads(p.stdout)
          runs=gh(f'/repos/{repo}/actions/workflows/five-year-round-test.yml/runs?per_page=15')['workflow_runs']
          lines=['Automated diagnosis and numerical analysis of latest MatchLens five-year workflow runs.']
          for run in runs[:8]:
              lines.append(f"\nRun {run['run_number']} | {run['conclusion']} | {run['head_sha']} | {run['html_url']}")
              if run.get('conclusion')=='success':
                  arts=gh(f"/repos/{repo}/actions/runs/{run['id']}/artifacts")['artifacts']
                  for art in arts:
                      lines.append(f"ARTIFACT {art['name']} | id={art['id']} | size={art['size_in_bytes']} | expired={art['expired']}")
                      import tempfile,zipfile,io
                      with tempfile.NamedTemporaryFile(suffix='.zip') as f:
                          dl=subprocess.run(['gh','api',f"/repos/{repo}/actions/artifacts/{art['id']}/zip"],stdout=f,stderr=subprocess.PIPE)
                          if dl.returncode: lines.append('ARTIFACT DOWNLOAD ERROR: '+dl.stderr.decode(errors='replace')[:600])
                          else:
                              with zipfile.ZipFile(f.name) as z:
                                  for name in z.namelist():
                                      if name.endswith(('five-year-round-learning.json','top25-single-pick.json','second-stage-walkforward.json')) or 'walkforward-threshold-0.json' in name:
                                          data=json.loads(z.read(name))
                                          lines.append('RESULT '+name+' '+json.dumps({k:v for k,v in data.items() if k in ('summary','years','comparison','baseline','challenger','period','protocol')},ensure_ascii=False)[:9000])
                                          if name.endswith('five-year-round-learning.json'):
                                              lines.append('ROUND COUNT '+str(len(data.get('rounds',[]))))
                                              rounds=data.get('rounds',[])
                                              paired=[q for q in rounds if 'challenger' in q]
                                              for label,subset in [('ALL',rounds),('PAIRED',paired)]:
                                                  for model in ('baseline','challenger'):
                                                      stats=[q[model] for q in subset if model in q and q[model].get('evaluated')]
                                                      n=sum(q['evaluated'] for q in stats); h=sum(q['hits'] for q in stats)
                                                      lines.append(f'FIVE_YEAR {label} {model} rounds={len(stats)} evaluated={n} hits={h} hit_rate={h/n if n else None}')
                                              for season in sorted(set(q['season'] for q in paired)):
                                                  group=[q for q in paired if q['season']==season]
                                                  for model in ('baseline','challenger'):
                                                      n=sum(q[model]['evaluated'] for q in group);h=sum(q[model]['hits'] for q in group)
                                                      lines.append(f'SEASON {season} {model} evaluated={n} hits={h} rate={h/n if n else None}')
              jobs=gh(f"/repos/{repo}/actions/runs/{run['id']}/jobs")['jobs']
              for job in jobs:
                  lines.append(f"Job {job['name']} | {job['conclusion']} | job_id={job['id']}")
                  for step in job.get('steps',[]):
                      if step.get('conclusion')=='failure':
                          lines.append(f"FAILED STEP: {step['name']} (number {step['number']})")
                          # Job logs provide the actual Python/GitHub error if accessible.
                          p=subprocess.run(['gh','api',f"/repos/{repo}/actions/jobs/{job['id']}/logs"],capture_output=True,text=True)
                          if p.returncode==0:
                              lines.append('LOG TAIL:\n'+p.stdout[-12000:])
                          else:
                              lines.append('LOG FETCH ERROR: '+p.stderr[:1000])
          body='\n'.join(lines)[:60000]
          subprocess.run(['gh','issue','create','--repo',repo,'--title','MatchLens five-year test: automated failed-step diagnosis','--body',body],check=True)
          print(body[:2500])
          PY
