name: MatchLens Elo exploratory backtest
on:
  workflow_dispatch:
  push:
    branches: [main, feature/elo-chronological-backtest]
    paths:
      - 'scripts/backtest_elo.py'
      - '.github/workflows/elo-backtest.yml'
permissions:
  contents: read
jobs:
  elo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore historical data
        run: python scripts/restore_openfootball_history.py
      - name: Run Elo benchmark
        run: python scripts/backtest_elo.py
      - name: Save metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchlens-elo-metrics
          path: out/backtest_elo.json
          if-no-files-found: error
