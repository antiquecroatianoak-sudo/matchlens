name: MatchLens large historical factor backtest
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
jobs:
  historical-factor-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy scikit-learn
      - name: Restore historical football archive
        run: python scripts/restore_openfootball_history.py
      - name: Batch import and audit multiple public football sources
        run: python -m scripts.import_sources_batch
      - name: Verify historical coverage
        run: |
          python - <<'PY'
          from analytics.backtest import load_matches
          rows,source=load_matches('data/openfootball')
          print('Historical rows:',len(rows))
          print('Coverage:',source['coverage'])
          assert len(rows)>=10000, 'Historical archive is insufficient for large testing'
          print('Historical seasons available:', sorted({r['season'] for r in rows}))
          PY
      - name: Run 84-feature large historical test
        run: python -m analytics.factor_search --data data/openfootball --output out/large-factor-backtest
      - name: Verify result volume and factor families
        run: |
          python - <<'PY'
          import json
          r=json.load(open('out/large-factor-backtest/factor-report.json'))
          assert r['protocol']['features']>=11
          assert r['protocol']['features']==84
          assert r['audit']['matches']>=1000
          print('Historical audit matches:',r['audit']['matches'])
          print('Development matches:',r['protocol']['chosen']['outcome']['development']['matches'])
          print('84-feature configurations:',r['protocol']['candidates'])
          PY
      - name: Select one of five markets for top quarter of each round
        run: |
          python -m scripts.join_round_predictions --data data/openfootball --predictions out/large-factor-backtest/factor-predictions.jsonl --output out/large-factor-backtest/round-predictions.jsonl
          python scripts/top25_single_pick.py --input out/large-factor-backtest/round-predictions.jsonl --output out/large-factor-backtest/top25-single-pick.json
          python - <<'PY'
          import json
          r=json.load(open('out/large-factor-backtest/top25-single-pick.json'))
          assert r['summary']['evaluated']>=100
          assert all(x['selected']<=x['fixtures']//4 for x in r['rounds'])
          assert len({x['id'] for x in r['selected']})==len(r['selected'])
          print('Top 25% single-pick hit rate:',r['summary']['hit_rate'])
          PY
      - name: Research-only fixed confidence thresholds (not an independent holdout)
        run: |
          for threshold in 0.75 0.80 0.85 0.90 0.95; do
            python scripts/top25_single_pick.py --input out/large-factor-backtest/round-predictions.jsonl --min-confidence "$threshold" --output "out/large-factor-backtest/threshold-${threshold}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('out/large-factor-backtest').glob('threshold-*.json')):
              summary=json.loads(path.read_text())['summary']
              print('Exploratory confidence threshold:',path.stem,summary)
          print('WARNING: Threshold outcomes on previously viewed audit are descriptive, not an independent test or proof of 90% accuracy.')
          PY
      - name: Retrospective multi-season expanding-window test
        run: |
          python -m scripts.multiseason_walkforward --data data/openfootball --lock out/large-factor-backtest/factor-lock.json --output out/large-factor-backtest/walkforward-predictions.jsonl
          python -m scripts.join_round_predictions --data data/openfootball --predictions out/large-factor-backtest/walkforward-predictions.jsonl --output out/large-factor-backtest/walkforward-rounds.jsonl
          for threshold in 0 0.75 0.80 0.85 0.90; do
            python scripts/top25_single_pick.py --input out/large-factor-backtest/walkforward-rounds.jsonl --min-confidence "$threshold" --output "out/large-factor-backtest/walkforward-threshold-$threshold.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('out/large-factor-backtest').glob('walkforward-threshold-*.json')):
              print('RETROSPECTIVE multi-season:',path.stem,json.loads(path.read_text())['summary'])
          print('CAUTION: Historical model selection used some of these seasons; this is NOT a pristine independent holdout.')
          PY
      - name: Audit top-quarter selection and compare fixed ranking alternatives
        run: |
          python -m scripts.selection_diagnostics --input out/large-factor-backtest/walkforward-rounds.jsonl --output out/large-factor-backtest/selection-diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matchlens-large-historical-factor-results
          path: |
            out/large-factor-backtest/
            out/external-source-audit/
          retention-days: 14
