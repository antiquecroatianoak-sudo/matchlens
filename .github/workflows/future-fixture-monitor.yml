name: MatchLens future fixture monitoring (research)
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/advanced-live-model-20261031']
    paths:
      - '.github/workflows/future-fixture-monitor.yml'
      - 'scripts/fetch_future_fixtures.py'
      - 'scripts/score_future_baseline.py'
      - 'scripts/football_data_fixture_candidates.py'
      - 'scripts/openligadb_future_fixtures.py'
      - 'scripts/freeze_prospective_predictions.py'
      - 'scripts/settle_prospective_predictions.py'
      - 'scripts/sync_prospective_oidc.py'
      - 'scripts/sync_prospective_settlement_oidc.py'
      - 'scripts/sync_future_fixtures_oidc.py'
      - 'tests/test_prospective_settlement.py'
      - 'tests/test_prospective_settlement_oidc.py'
      - 'tests/test_live_poisson_mapping.py'
      - 'tests/test_bundesliga_team_aliases.py'
      - 'tests/test_freeze_prospective_predictions.py'
      - 'tests/test_two_season_prospective_window.py'
      - 'tests/test_prospective_factors.py'
      - 'tests/test_prospective_model_lock.py'
      - 'tests/test_prospective_advanced.py'
      - 'analytics/prospective_advanced.py'
      - 'scripts/score_future_advanced.py'
      - 'scripts/select_prospective_model.py'
      - 'tests/test_select_prospective_model.py'
      - 'tests/test_recent_history_restore.py'
  schedule:
    - cron: '17 7 * * *'
jobs:
  settle-previous-predictions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test authenticated settlement integration
        run: python -m unittest discover -s tests -p 'test_prospective_settlement_oidc.py'
      - name: Settle saved predictions against verified final scores
        if: github.ref == 'refs/heads/main'
        run: python -m scripts.sync_prospective_settlement_oidc
  fetch-future-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install advanced model test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2'
      - name: Test live fixture league mapping
        run: python -m unittest discover -s tests -p 'test_live_poisson_mapping.py'
      - name: Test Bundesliga team name aliases
        run: python -m unittest discover -s tests -p 'test_bundesliga_team_aliases.py'
      - name: Test prospective snapshot safety
        run: python -m unittest discover -s tests -p 'test_freeze_prospective_predictions.py'
      - name: Test prospective settlement
        run: python -m unittest discover -s tests -p 'test_prospective_settlement.py'
      - name: Test two completed seasons for prospective inference
        run: python -m unittest discover -s tests -p 'test_two_season_prospective_window.py'
      - name: Test 84-feature prospective isolation
        run: python -m unittest discover -s tests -p 'test_prospective_factors.py'
      - name: Test advanced model lock validation
        run: python -m unittest discover -s tests -p 'test_prospective_model_lock.py'
      - name: Test two-season advanced inference
        run: python -m unittest discover -s tests -p 'test_prospective_advanced.py'
      - name: Test advanced model selection for production
        run: python -m unittest discover -s tests -p 'test_select_prospective_model.py'
      - name: Verify two completed historical seasons
        run: python -m unittest discover -s tests -p 'test_recent_history_restore.py'
      - name: Retrieve upcoming fixtures
        run: python -m scripts.fetch_future_fixtures
      - name: Persist verified future fixtures in MatchLens database
        if: github.ref == 'refs/heads/main'
        run: python -m scripts.sync_future_fixtures_oidc
      - name: Restore scored historical matches
        run: python -m scripts.restore_openfootball_history --recent-two
      - name: Score upcoming fixtures using past-only baseline
        run: python -m scripts.score_future_baseline
      - name: Score upcoming fixtures with locked advanced model
        run: python -m scripts.score_future_advanced
      - name: Report verified fixture and model coverage before persistence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fixtures=json.loads(Path('out/future-fixtures.json').read_text())
          baseline=json.loads(Path('out/upcoming-coverage.json').read_text())
          advanced=json.loads(Path('out/upcoming-advanced-coverage.json').read_text())
          print('VERIFIED FUTURE FIXTURES:',len(fixtures['fixtures']))
          print('BASELINE SCORED:',baseline['scored'])
          print('ADVANCED SCORED:',advanced['scored'])
          print('SOURCE ERRORS:',json.dumps(fixtures['source_errors'])[:3000])
          print('BASELINE SKIPS:',json.dumps(baseline['skipped'])[:3000])
          print('ADVANCED SKIPS:',json.dumps(advanced['skipped'])[:3000])
          if not fixtures['fixtures']:
              raise SystemExit('No verified future fixtures from providers; cannot create genuine predictions')
          if not (baseline['scored'] or advanced['scored']):
              raise SystemExit('No scoreable future fixtures; inspect mapping and historical coverage')
          PY
      - name: Prefer validated advanced forecasts for production snapshots
        run: python -m scripts.select_prospective_model
      - name: Freeze prospective predictions and research top 25 percent
        run: python -m scripts.freeze_prospective_predictions
      - name: Persist prospective snapshots in MatchLens database
        if: github.ref == 'refs/heads/main'
        run: python -m scripts.sync_prospective_oidc
      - name: Check provider results for snapshot (research)
        run: python -m scripts.settle_prospective_predictions
      - name: Publish fixture snapshot
        uses: actions/upload-artifact@v4
        with:
          name: matchlens-future-fixtures
          path: |
            out/future-fixtures.json
            out/upcoming-probabilities.jsonl
            out/upcoming-coverage.json
            out/upcoming-advanced-probabilities.jsonl
            out/upcoming-advanced-coverage.json
            out/prospective-predictions.jsonl
            out/prospective-summary.json
            out/prospective-settlement.json
          retention-days: 30
