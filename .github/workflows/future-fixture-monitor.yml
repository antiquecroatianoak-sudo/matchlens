name: MatchLens future fixture monitoring (research)
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/prospective-cycle-20261031']
    paths:
      - '.github/workflows/future-fixture-monitor.yml'
      - 'scripts/fetch_future_fixtures.py'
      - 'scripts/score_future_baseline.py'
      - 'scripts/football_data_fixture_candidates.py'
      - 'scripts/openligadb_future_fixtures.py'
      - 'scripts/freeze_prospective_predictions.py'
      - 'scripts/settle_prospective_predictions.py'
      - 'scripts/sync_prospective_oidc.py'
      - 'tests/test_prospective_settlement.py'
      - 'tests/test_live_poisson_mapping.py'
      - 'tests/test_freeze_prospective_predictions.py'
  schedule:
    - cron: '17 7 * * *'
jobs:
  fetch-future-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test live fixture league mapping
        run: python -m unittest discover -s tests -p 'test_live_poisson_mapping.py'
      - name: Test prospective snapshot safety
        run: python -m unittest discover -s tests -p 'test_freeze_prospective_predictions.py'
      - name: Test prospective settlement
        run: python -m unittest discover -s tests -p 'test_prospective_settlement.py'
      - name: Retrieve upcoming fixtures
        run: python -m scripts.fetch_future_fixtures
      - name: Restore scored historical matches
        run: python -m scripts.restore_openfootball_history
      - name: Score upcoming fixtures using past-only baseline
        run: python -m scripts.score_future_baseline
      - name: Freeze prospective predictions and research top 25 percent
        run: python -m scripts.freeze_prospective_predictions
      - name: Persist prospective snapshots in MatchLens database
        if: github.ref == 'refs/heads/main'
        run: python -m scripts.sync_prospective_oidc
      - name: Check provider results for snapshot (research)
        run: python -m scripts.settle_prospective_predictions
      - name: Publish fixture snapshot
        uses: actions/upload-artifact@v4
        with:
          name: matchlens-future-fixtures
          path: |
            out/future-fixtures.json
            out/upcoming-probabilities.jsonl
            out/upcoming-coverage.json
            out/prospective-predictions.jsonl
            out/prospective-summary.json
            out/prospective-settlement.json
          retention-days: 30
