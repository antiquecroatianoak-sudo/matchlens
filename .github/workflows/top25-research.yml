name: MatchLens scheduled top25 research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: top25-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate available pre-match historical predictions
        env:
          HISTORICAL_CSV_URL: ${{ secrets.MATCHLENS_HISTORICAL_CSV_URL }}
        run: |
          if [ -z "$HISTORICAL_CSV_URL" ]; then
            echo "::error::Configure MATCHLENS_HISTORICAL_CSV_URL pointing to a private, time-limited historical CSV export."
            exit 1
          fi
          python - <<'PY'
          import os, urllib.request
          url=os.environ["HISTORICAL_CSV_URL"]
          if not url.startswith("https://"):
              raise ValueError("HTTPS required")
          urllib.request.urlretrieve(url,"historical.csv")
          PY
          python scripts/optimize_top25.py historical.csv --output optimization-results.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: top25-research-results
          path: optimization-results.json
          retention-days: 30
