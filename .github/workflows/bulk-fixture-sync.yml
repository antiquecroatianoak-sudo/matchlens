name: MatchLens bulk fixture sync
# Retry after verified OIDC subject-claim fix in Edge Function v6.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bulk-fixture-sync.yml'
      - 'scripts/sync_openfootball_oidc.py'
      - 'scripts/sync_openfootball_supabase.py'
      - 'scripts/restore_openfootball_history.py'
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: matchlens-bulk-fixtures
  cancel-in-progress: false
jobs:
  bulk-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate import script
        run: python -m py_compile scripts/sync_openfootball_supabase.py
      - name: Restore complete historical seasons in batches
        run: python scripts/restore_openfootball_history.py
      - name: Report archive coverage before database writes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files=list(Path('data/openfootball').glob('*.json'))
          count=0
          leagues=set()
          for path in files:
              obj=json.loads(path.read_text())
              count+=len(obj.get('matches',[]))
              leagues.add('.'.join(path.name.split('.')[1:3]))
          print(f'Archive: {len(files)} files, {count} match records, {len(leagues)} leagues')
          assert count>=10000, 'Historical download incomplete: refusing partial bulk sync'
          PY
      - name: Sync fixture batches using GitHub OIDC
        run: python scripts/sync_openfootball_oidc.py
